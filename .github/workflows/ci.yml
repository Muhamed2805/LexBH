name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: lexbh
          POSTGRES_PASSWORD: lexbh_ci_only
          POSTGRES_DB: lexbh
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lexbh -d lexbh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LEXBH_ENVIRONMENT: test
      LEXBH_DATABASE_URL: postgresql+asyncpg://lexbh:lexbh_ci_only@127.0.0.1:5433/lexbh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src tests

      - name: Unit tests
        run: pytest

      - name: Integration tests
        run: pytest -m integration
